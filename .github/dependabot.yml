# Dependency updates (progress.md Q6): Python (uv), the web app (npm) and CI actions.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    ignore:
      # Pyodide is pinned with a hard-coded numpy hash (web_runtime.py): update by hand
      - dependency-name: "pyodide"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
