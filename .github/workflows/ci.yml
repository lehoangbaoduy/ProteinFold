# Same gates as local development: tests + coverage, lint, SAST, dependency audit, web tests.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - run: npm --prefix web ci
      - run: npm --prefix web audit --audit-level=moderate
      - run: npm --prefix web test
      - run: npm --prefix web run typecheck
      - run: make web-runtime
