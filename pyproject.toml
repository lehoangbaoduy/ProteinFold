[project]
name = "proteinfold"
version = "0.1.0"
description = "HP lattice protein folding with GA, ACO and PSO (EECS 6180 project)"
requires-python = ">=3.12"
# The core package (hpfold) must stay stdlib + numpy only so it runs in Pyodide.
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
# Native-only tooling: experiments, statistics, plots, web export.
tools = ["scipy>=1.13", "pandas>=2.2", "matplotlib>=3.9"]

[dependency-groups]
dev = [
    # tooling deps are needed by the test suite, so a fresh `uv sync && make test` works
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpfold", "src/hpfold_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/hpfold", "src/hpfold_tools"]
branch = true
