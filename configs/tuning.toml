# T3.3 / PRD §7.3 — parameter tuning with EQUAL effort per algorithm:
# 6 configurations x 2 tuning sequences x 10 seeds for each of GA, ACO, PSO.
# Tuning sequences S1-2 and S1-6 are held out from the pilot (S1-1) and from the
# penalty-vs-repair experiment (S1-4, S1-5, S1-7); all tuning-touched instances
# are flagged in the paper. GA and PSO use repair (decision D24); ACO builds
# valid folds by construction. Budget = the main study's (c = 20).
name = "tuning"
dim = 2
instances = ["S1-2", "S1-6"]
seeds = 10
seed_offset = 1000  # seeds disjoint from the main study (0-29)
budget_c = 20
budget_min = 10000
stop_at_best_known = true

[[variants]]
label = "GA-p50-k3"
algorithm = "GA"
params = { strategy = "repair", pop_size = 50, tournament_k = 3 }

[[variants]]
label = "GA-p50-k5"
algorithm = "GA"
params = { strategy = "repair", pop_size = 50, tournament_k = 5 }

