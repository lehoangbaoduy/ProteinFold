# T3.4 / PRD §7.1 — main 2D study: every 2D benchmark x GA/ACO/PSO x 30 seeds,
# identical budget B(n) = max(10 000, 20 n^2) (decision D25).
# Parameters are the equal-effort tuning winners (results/tuning.csv, decision D27);
# GA and PSO use repair (D24). Tuning-touched instances, flagged in the paper:
# S1-1 (pilot), S1-2 and S1-6 (tuning), S1-4, S1-5, S1-7 (penalty vs repair).
name = "main_2d"
dim = 2
instances = ["S1-1", "S1-2", "S1-3", "S1-4", "S1-5", "S1-6", "S1-7", "S1-8", "S1-9", "S1-10", "S1-11"]
seeds = 30
budget_c = 20
budget_min = 10000
stop_at_best_known = true

[[variants]]
label = "GA"
algorithm = "GA"
params = { strategy = "repair", pop_size = 100, tournament_k = 3 }

[[variants]]
label = "ACO"
algorithm = "ACO"
params = { rho = 0.1, beta = 3.0 }

[[variants]]
label = "PSO"
algorithm = "PSO"
params = { strategy = "repair", w = 0.7, c1 = 1.0, c2 = 1.0, epsilon = 0.05 }
